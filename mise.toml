[tools]
bun = "1.4.2"
node = "22.23.3"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]
CF_SEND_TELEMETRY = "false"

[tasks.build]
run = "bun run build"
[tasks.test]
run = "bun run test"
[tasks.deploy]
description = "Build the Vite app, then deploy the Worker + assets with cf"
depends = ["test"]
run = "CF_BUILD=1 mise exec -- cf deploy"
